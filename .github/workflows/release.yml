name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: ubuntu-22.04-arm
          # macOS still fails on real macOS runners (PTY, process stats, launchctl); keep building it
          # but don't let it block Linux releases until it is green.
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npm run package
      # Linux archives ship prebuilt native modules (node-pty, better-sqlite3). Building them on the
      # runner (Ubuntu 22.04, glibc 2.35) made pty.node require GLIBC_2.34 and fail on Ubuntu 20.04.
      # Build inside Debian 11 (glibc 2.31) so the archive runs on Ubuntu 20.04+ / Debian 11+.
      - name: Package (Linux, built on Debian 11 / glibc 2.31)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src node:22-bullseye sh -c 'npm ci && npm --prefix web ci && npm run package'
          sudo chown -R "$(id -u):$(id -g)" .
      - name: Native modules must not need glibc newer than 2.31
        if: runner.os == 'Linux'
        run: sh scripts/check-glibc.sh "$(find release -name 'agenthub-*-linux-*.tar.gz' -print -quit)" 2.31
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ runner.arch }}
          path: release/*

  smoke:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-ubuntu-*
          merge-multiple: true
          path: release
      - run: chmod +x scripts/smoke-install.sh
      - name: Smoke install on Debian 12
        run: SMOKE_IMAGE=node:22-slim scripts/smoke-install.sh "$(find release -name 'agenthub-*-linux-x64.tar.gz' -print -quit)"
      - name: Smoke install on Debian 11 (oldest supported glibc, 2.31)
        run: SMOKE_IMAGE=node:22-bullseye-slim scripts/smoke-install.sh "$(find release -name 'agenthub-*-linux-x64.tar.gz' -print -quit)"

  smoke-macos:
    # Install the macOS archive natively on a clean runner and check /health.
    needs: package
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-macos-*
          merge-multiple: true
          path: release
      - run: ls -la release
      - name: Smoke install without Node or usable git on PATH
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: sh scripts/smoke-install-native.sh "$(find release -name 'agenthub-*-macos-*.tar.gz' -print -quit)"

  publish:
    needs: [package, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # install.sh matches bare file names in SHA256SUMS, so hash from inside release/.
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            # Tags like v1.0.0-rc.1 are test builds: publish them as pre-releases.
            case "${GITHUB_REF_NAME}" in *-*) PRE=--prerelease ;; *) PRE= ;; esac
            gh release create "${GITHUB_REF_NAME}" release/* --generate-notes $PRE
          fi
