name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            experimental: false
          - os: ubuntu-22.04-arm
            experimental: false
          # Build on both supported macOS architectures so native node-pty and
          # better-sqlite3 binaries match the user's machine.
          - os: macos-15-intel
            experimental: true
          - os: macos-latest
            experimental: true
    runs-on: ${{ matrix.os }}
    # macOS runner availability/native compatibility still needs confirmation
    # on GitHub. Keep Linux release artifacts publishable while this is proven.
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag must match package.json version
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: npm run package
      # Linux archives ship prebuilt native modules (node-pty, better-sqlite3). Building them on the
      # runner (Ubuntu 22.04, glibc 2.35) made pty.node require GLIBC_2.34 and fail on Ubuntu 20.04.
      # Build inside Debian 11 (glibc 2.31) so the archive runs on Ubuntu 20.04+ / Debian 11+.
      - name: Package (Linux, built on Debian 11 / glibc 2.31)
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/src" -w /src node:22-bullseye sh -c 'npm ci && npm --prefix web ci && npm run package'
          sudo chown -R "$(id -u):$(id -g)" .
      - name: Native modules must not need glibc newer than 2.31
        if: runner.os == 'Linux'
        run: sh scripts/check-glibc.sh "$(find release -name 'agenthub-*-linux-*.tar.gz' -print -quit)" 2.31
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ runner.arch }}
          path: release/*

  smoke:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-ubuntu-*
          merge-multiple: true
          path: release
      - run: chmod +x scripts/smoke-install.sh
      - name: Smoke install on Debian 12
        run: SMOKE_IMAGE=node:22-slim scripts/smoke-install.sh "$(find release -name 'agenthub-*-linux-x64.tar.gz' -print -quit)"
      - name: Smoke install on Debian 11 (oldest supported glibc, 2.31)
        run: SMOKE_IMAGE=node:22-bullseye-slim scripts/smoke-install.sh "$(find release -name 'agenthub-*-linux-x64.tar.gz' -print -quit)"

  smoke-macos:
    # Install the macOS archive natively on a clean runner and check /health.
    # This remains non-blocking until PTY, native SQLite and launchctl are
    # confirmed on both hosted macOS architectures.
    continue-on-error: true
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: release-macos-*
          merge-multiple: true
          path: release
      - run: ls -la release
      - name: Smoke install without Node or usable git on PATH
        env:
          PATH: /usr/bin:/bin:/usr/sbin:/sbin
        run: |
          case "$(uname -m)" in
            arm64) ARCH=arm64 ;;
            x86_64) ARCH=x64 ;;
            *) echo "Unsupported macOS architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          sh scripts/smoke-install-native.sh "$(find release -name "agenthub-*-macos-${ARCH}.tar.gz" -print -quit)"

  publish:
    needs: [package, smoke, smoke-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # install.sh matches bare file names in SHA256SUMS, so hash from inside release/.
          (cd release && sha256sum *.tar.gz > SHA256SUMS)
          # Keep the runner independent of the optional gh CLI. The worker-side
          # release procedure is also REST-only, so both paths use the same API.
          api="https://api.github.com/repos/${GH_REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json')
          release_json="$(mktemp)"
          trap 'rm -f "$release_json" release-request.json' EXIT
          status="$(curl -sS "${auth[@]}" -o "$release_json" -w '%{http_code}' \
            "$api/releases/tags/${GITHUB_REF_NAME}")"
          if [ "$status" = 404 ]; then
            # Tags like v1.0.0-rc.1 are test builds: publish them as pre-releases.
            prerelease=false
            case "${GITHUB_REF_NAME}" in *-*) prerelease=true ;; esac
            PRE_RELEASE="$prerelease" node -e 'process.stdout.write(JSON.stringify({tag_name: process.env.GITHUB_REF_NAME, name: process.env.GITHUB_REF_NAME, generate_release_notes: true, prerelease: process.env.PRE_RELEASE === "true"}))' \
              > release-request.json
            curl --fail-with-body -sS -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              --data-binary @release-request.json "$api/releases" > "$release_json"
          elif [ "$status" -ne 200 ]; then
            cat "$release_json"
            exit 1
          fi
          upload_url="$(node -e 'const fs=require("fs"); process.stdout.write(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).upload_url || "")' "$release_json")"
          test -n "$upload_url"
          upload_url="${upload_url%%\{*}"
          # Match gh release upload --clobber when a tag is retried.
          while IFS=$'\t' read -r asset_id asset_name; do
            for local_asset in release/*; do
              if [ "$(basename "$local_asset")" = "$asset_name" ]; then
                curl --fail-with-body -sS -X DELETE "${auth[@]}" \
                  "$api/releases/assets/${asset_id}" >/dev/null
              fi
            done
          done < <(node -e 'const fs=require("fs"); const r=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); for (const a of (r.assets || [])) console.log(`${a.id}\t${a.name}`)' "$release_json")
          for asset in release/*; do
            name="$(basename "$asset")"
            case "$name" in
              *.tar.gz) content_type='application/gzip' ;;
              *) content_type='text/plain' ;;
            esac
            curl --fail-with-body -sS -X POST "${auth[@]}" \
              -H "Content-Type: ${content_type}" --data-binary "@${asset}" \
              "${upload_url}?name=${name}" >/dev/null
          done
