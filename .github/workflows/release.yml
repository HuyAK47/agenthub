name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix web ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}-${{ runner.arch }}
          path: release/*

  smoke:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-ubuntu-*
          merge-multiple: true
          path: release
      - run: chmod +x scripts/smoke-install.sh
      - run: scripts/smoke-install.sh "$(find release -name 'agenthub-*.tar.gz' -print -quit)"

  publish:
    needs: [package, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum release/*.tar.gz > release/SHA256SUMS
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* --generate-notes
          fi
